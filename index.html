<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes System Design</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>QuickNotes</h1>
      <p>Simple notes, powered by an API.</p>
    </header>

    <section class="panel">
      <h2>Your notes</h2>

      <button id="load-btn" type="button">Load notes</button>

      <p id="status" role="status" aria-live="polite">
        Click "Load notes" to fetch notes from the server.
      </p>

      <form id="note-form">
        <h3>Create a note</h3>

        <label for="title-input">Title (required, maximum 100 characters)</label>
        <input
          id="title-input"
          name="title"
          type="text"
          maxlength="100"
          required
        >

        <label for="body-input">Note body (optional)</label>
        <textarea
          id="body-input"
          name="body"
          rows="4"
        ></textarea>

        <button id="submit-btn" type="submit">Create note</button>
      </form>

      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
